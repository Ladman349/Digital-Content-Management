apply plugin: 'com.android.application'

// The controller app signs with the same release key as the TV player. The values are read from
// the player's git-ignored android/local.properties (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD,
// RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) or from the environment, so nothing secret lives here.
def playerLocalProps = new Properties()
def playerLocalPropsFile = rootProject.file('../../android/local.properties')
if (playerLocalPropsFile.exists()) {
    playerLocalPropsFile.withInputStream { playerLocalProps.load(it) }
}
def signingValue = { String key -> playerLocalProps.getProperty(key) ?: System.getenv(key) }
def storeFileValue = signingValue('RELEASE_STORE_FILE')
def storePasswordValue = signingValue('RELEASE_STORE_PASSWORD')
def keyAliasValue = signingValue('RELEASE_KEY_ALIAS')
def keyPasswordValue = signingValue('RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = storeFileValue && storePasswordValue && keyAliasValue && keyPasswordValue

android {
    namespace = "com.grovitai.signage"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.grovitai.signage"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Rises with every distributed build; Android refuses to install an equal or lower code.
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                // The player resolves RELEASE_STORE_FILE relative to its app module (android/app),
                // so a relative value has to be resolved from there, not from this project.
                def resolved = new File(storeFileValue)
                storeFile = resolved.isAbsolute() ? resolved : rootProject.file("../../android/app/${storeFileValue}")
                storePassword = storePasswordValue
                keyAlias = keyAliasValue
                keyPassword = keyPasswordValue
            }
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Release signing is not configured; assembleRelease will produce an unsigned APK. See docs/MOBILE_APPS.md.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
