# Runs on every push and pull request: the backend test suite, the CMS type-check, lint and build,
# and the TV player's unit tests. Nothing here needs a secret or deploys anything; it exists so a
# broken change is caught before Railway, Vercel or a screen ever sees it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      player: ${{ steps.filter.outputs.player }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Plain git rather than a third-party action: each part of the repo is only checked when it,
      # or this workflow, changed. A push with no usable base (first push, force push) checks all.
      - id: filter
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; echo "player=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          for part in backend frontend; do
            if echo "$changed" | grep -qE "^($part/|\.github/workflows/ci\.yml)"; then echo "$part=true" >> "$GITHUB_OUTPUT"; else echo "$part=false" >> "$GITHUB_OUTPUT"; fi
          done
          if echo "$changed" | grep -qE "^(android/|\.github/workflows/ci\.yml)"; then echo "player=true" >> "$GITHUB_OUTPUT"; else echo "player=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The suite runs on in-memory SQLite and needs no database or storage. SQL that only
      # PostgreSQL would reject is pinned by tests that render it for that dialect.
      - run: python -m pytest tests -q

  frontend:
    name: CMS type-check, lint and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx eslint src --max-warnings 0
      - run: npx vite build

  player:
    name: TV player unit tests
    needs: changes
    if: needs.changes.outputs.player == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # The debug variant: unit tests never package an APK, so no signing key is involved.
      # Gradle configures every flavour even when building one, and the dev flavour refuses to
      # configure without an API address. It is not built here; the value is never used.
      - run: ./gradlew testProdDebugUnitTest --console=plain
        env:
          DEV_API_HOST: 127.0.0.1
          DEV_API_PORT: "8000"

  e2e:
    name: CMS browser tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # The real API on a brand-new SQLite file in a temporary folder, and the real CMS against it.
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
